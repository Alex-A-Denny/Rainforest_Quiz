<div class="login-container">

    <h1>Welcome to Rainforest Quiz</h1>


    <input [(ngModel)]="username" placeholder="username" maxlength="12"/> <br>
    <input [(ngModel)]="password" placeholder="password" maxlength="12"/> <br>
    <button  (click)="login()">Login</button>
    <button  (click)="register()">Register</button>
    <p *ngIf="loginError">{{ loginError }}</p>



</div>
